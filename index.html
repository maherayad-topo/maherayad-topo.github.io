<title>Converter E/N ⇄ WGS84</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f3f5f9;--card:#fff;--text:#1b2433;--muted:#5f6b7e;--line:#d5dbe6;--accent:#1f5fbf;--accent-t:#fff;--ok:#e6f4ea;--warn:#fff3d6;--warn-t:#7a5200;--err:#b3261e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#12161d;--card:#1b212b;--text:#e8ecf3;--muted:#9aa6b8;--line:#2e3846;--accent:#6aa3ff;--accent-t:#0b1220;--ok:#1b3326;--warn:#3a2f10;--warn-t:#f2c75c;--err:#ff8a80}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#12161d;--card:#1b212b;--text:#e8ecf3;--muted:#9aa6b8;--line:#2e3846;--accent:#6aa3ff;--accent-t:#0b1220;--ok:#1b3326;--warn:#3a2f10;--warn-t:#f2c75c;--err:#ff8a80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.5}
main{max-width:520px;margin:0 auto;padding:18px 14px 28px}
.head{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px}
.brand{display:flex;flex-direction:column;align-items:center;gap:3px;width:104px;flex:none;text-align:center}
.brand img{width:52px;height:52px;border-radius:50%;display:block;background:#fff}
.brand span{font-size:.62rem;line-height:1.3;color:var(--muted)}
.brand a.tel{white-space:nowrap;font-size:.68rem;color:var(--accent);text-decoration:none;direction:ltr;unicode-bidi:isolate}
h1{font-size:1.02rem;margin:0 0 2px;line-height:1.25}
.sub{color:var(--muted);font-size:.76rem;margin:0;line-height:1.35}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
label{display:block;font-size:.85rem;color:var(--muted);margin:0 0 4px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;direction:ltr}
input{width:100%;font:inherit;font-size:1.05rem;padding:11px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);direction:ltr;text-align:left}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
.res{direction:ltr;text-align:left;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.1rem;word-break:break-all;background:var(--ok);border-radius:10px;padding:10px 12px;margin:6px 0 10px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
a.btn,button{font:inherit;font-weight:600;padding:11px 14px;border-radius:10px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-t);text-decoration:none;cursor:pointer;text-align:center;flex:1 1 140px}
button.sec{background:transparent;color:var(--accent)}
a.disabled{opacity:.4;pointer-events:none}
.msg{font-size:.85rem;margin-top:8px}
.warn{background:var(--warn);color:var(--warn-t);border-radius:10px;padding:8px 10px}
.err{color:var(--err)}
[hidden]{display:none!important}
.tabs{display:flex;gap:6px;margin-bottom:12px;direction:ltr}
.tabs button.tab{background:transparent;color:var(--accent);flex:1 1 0;padding:9px 8px;font-size:.9rem}
.tabs button.tab.on{background:var(--accent);color:var(--accent-t)}
a.btn.wa{background:#1e8e4f;border-color:#1e8e4f;color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px;flex:2 1 200px}
.pinb{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:#fff;flex:none}
select,textarea{width:100%;font:inherit;font-size:1rem;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);direction:ltr;text-align:left}
textarea{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.85rem;resize:vertical;margin-top:0}
input[type=file]{font-size:.8rem;padding:7px}
.tblw{overflow-x:auto;margin-top:8px}
table{width:100%;border-collapse:collapse;direction:ltr;font-size:.8rem}
th,td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{color:var(--muted);font-weight:600}
td a{color:var(--accent)}
.tabs button.tab{font-size:.82rem}
button:disabled{opacity:.4;cursor:default}
.lblrow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mini{flex:0 0 auto;padding:3px 10px;font-size:.8rem;font-weight:600}
.mini.on{background:var(--accent);color:var(--accent-t)}
.tabs button.tab{white-space:nowrap;padding:10px 4px;font-size:.78rem}
@media (max-width:359px){.tabs button.tab{font-size:.66rem;padding:10px 2px}}
.head2{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.logo2{width:52px;height:52px;border-radius:50%;background:#fff;flex:none;display:block}
.ttl2{flex:1;min-width:0}
.credit{font-size:.64rem;color:var(--muted);margin:0 0 12px 0}
.lb{display:inline-block;margin-left:8px;padding:1px 6px;border:1px solid var(--line);border-radius:6px;font-size:.62rem;font-weight:600;color:var(--muted);vertical-align:middle;letter-spacing:.04em}
.credit a{color:var(--accent);text-decoration:none;white-space:nowrap}
@media (max-width:380px){.credit{font-size:.6rem}}
@media (max-width:350px){.credit{font-size:.56rem}.ttl2 h1{font-size:.95rem}}
.acts{display:flex;gap:6px;direction:ltr}
#cl{flex:1 1 100%;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.foot{color:var(--muted);font-size:.78rem;margin-top:6px}
details summary{cursor:pointer;color:var(--muted);font-size:.85rem}
</style>
</head>
